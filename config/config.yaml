seed: 42
io:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  models_dir: models
  reports_dir: reports
  site_data_dir: docs/data
  format: parquet            # or csv
rules:
  overs: 20
  balls_per_innings: 120
  wickets: 10
  non_wicket_dismissals: ["retired hurt", "retired not out"]
  rrr_clip: 36.0
  momentum_window_legal_balls: 18
  big_over_runs: 15
split:
  n_test_seasons: 2
  n_val_seasons: 1
baseline:
  runs_band: 10
  runs_cap: 200              # runs_needed >= 200 share one band
  balls_band: 12
  wicket_groups: [[8, 10], [5, 7], [3, 4], [1, 2]]
  min_count: 30
  level_c: {runs_band: 30, balls_band: 36}
lr:
  C_grid: [0.01, 0.03, 0.1, 0.3, 1.0, 3.0, 10.0]
  max_iter: 5000
gbm:
  learning_rate: [0.03, 0.06, 0.1]
  max_leaf_nodes: [15, 31, 63]
  min_samples_leaf: [50, 200, 800]
  l2_regularization: [0.0, 1.0]
  max_iter: [300, 600]
  monotonic: [true, false]
recency:                     # D8: sample weights 0.5 ** ((latest fit season - season) / half_life)
  half_life_grid: [null, 8, 4, 2]   # seasons; null = uniform weights. Applies to LR-full, LR-core, GBM
  gbm_top_k: 10              # GBM: full grid with uniform weights, then top-k configs x other half-lives
simulation:                  # post-test addition: ball-by-ball model for edge cases (edgecases stage)
  rrr_bands: [6, 8, 10, 12, 15]           # required-rate band edges for a delivery's context
  wicket_groups: [[9, 10], [7, 8], [5, 6], [3, 4], [2, 2], [1, 1]]
  legal_max_runs: 6          # legal-ball runs 0..6 (rare 7s counted as 6)
  extra_max_runs: 7          # runs on a wide / no-ball 1..7 (no-ball + six = 7)
  max_runs: 300              # largest runs-needed value solved
  shrinkage_grid: [5, 25, 100]           # pseudo-deliveries pulling a context towards its parent
  support_bucket: {runs: 5, balls: 6}    # "has the data seen this state?" cell, same wickets left
  blend_k_grid: [1, 3, 10, 30]      # LR-core weight n/(n+k), n = fitting chases in the cell (chosen on validation)
  n_parity_vectors: 250
  display_floor: 0.01        # show values under 1% as "under 1%" and over 99% as "over 99%"
eval:
  n_bootstrap: 1000
  ci: 0.95
  calibration_bins: 10
  logloss_eps: 1.0e-6
  n_failure_cases: 5
export:
  prob_decimals: 4
  n_parity_vectors: 250
  calculator_max_runs: 300   # calculator input range for runs needed (balls/wickets come from rules)
  diagnostic_target_bins: [160, 180, 200, 220, 240]   # post-test "by target" table on the results page
  max_site_data_mb: 10
